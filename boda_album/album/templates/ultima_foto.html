<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Cumple Cande XV">
<meta property="og:description" content="Galeria de Fotos en tiempo real.">
<meta property="og:image" content="https://galeriadefotos.pythonanywhere.com/static/img/hero.jpeg">
<meta property="og:url" content="https://galeriadefotos.pythonanywhere.com/">
<meta property="og:type" content="website">
    <title>Última Foto</title>
    </head>
    {% load static %}
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
            text-align: center;
            color: white;
        }

        /* 🔹 Video de fondo */
        .video-bg {
    position: fixed;
    top: 0;
    left: 50%;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    transform: translateX(-50%);
    z-index: -1;
}


        /* 🔹 Texto en la esquina */
        .background-text {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 3vw;
            font-family: 'Dancing Script', cursive;
            font-weight: bold;
            color: rgba(212, 104, 21, 0.8);
            text-shadow: 0 0 15px rgb(206, 29, 150);
            z-index: 3;
            text-transform: uppercase;
        }

        /* 🔹 Contenedor de la imagen */
        .foto-container {
            width: 50%;
            max-height: 90vh;
            position: relative;
            z-index: 2;
        }

        .foto-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(225, 178, 8, 0.8);
        }

        #mensaje-no-foto {
            font-size: 1.5em;
            z-index: 2;
            background: url('{% static "img/default.jpeg" %}');
        }
        #fullscreen-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 10px 15px;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    transition: opacity 0.3s ease;
}

#fullscreen-btn:hover {
    background: rgba(0, 0, 0, 0.9);
}

    </style>
</head>
<body>
    <!-- 🔹 Video de fondo -->
    <video class="video-bg" autoplay muted loop onclick="toggleFullScreen()">
        <source src="{% static 'videos/camila.mp4' %}" type="video/mp4">
        Tu navegador no soporta el video.
    </video>
    
    
    <div class="foto-container">
        <img id="ultima-foto" src="{% static 'img/default.jpeg' %}" alt="Cargando foto..." loading="lazy" onerror="this.src='{% static 'img/default.jpeg' %}'">
        <p id="mensaje-no-foto" style="display: none;">No hay fotos aún.</p>
    </div>
    <button id="fullscreen-btn" onclick="toggleFullScreen()">🔳 Pantalla Completa</button>
<!-- template.html -->
<script>
  let fotosAnteriores = [];
let indiceFoto = 0;

function cargarUltimaFoto() {
    fetch("{% url 'obtener_ultima_foto' %}", { cache: "no-store" })
        .then(response => response.json())
        .then(data => {
            if (data.urls.length > 0) {
                fotosAnteriores = data.urls;
                indiceFoto = 0;
                mostrarFoto(fotosAnteriores[indiceFoto]);
            } else {
                mostrarFoto("{% static 'img/default.jpeg' %}");
            }
        });
}

function mostrarFoto(url) {
    const img = document.getElementById("ultima-foto");
    if (img.src !== url) {
        img.style.opacity = 0;
        setTimeout(() => {
            img.src = url;
            img.style.opacity = 1;
            document.getElementById("mensaje-no-foto").style.display = "none";
        }, 500);
    }
}

function cambiarFoto() {
    if (fotosAnteriores.length > 1) {
        indiceFoto = (indiceFoto + 1) % fotosAnteriores.length;
        mostrarFoto(fotosAnteriores[indiceFoto]);
    } else {
        cargarUltimaFoto();
    }
}

// Cargar imagen inicial
cargarUltimaFoto();
setInterval(cambiarFoto, 5000);


</script>


    <script>
  function toggleFullScreen() {
    let fullscreenBtn = document.getElementById("fullscreen-btn");

    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
            fullscreenBtn.style.display = "none"; // Oculta el botón al activar pantalla completa
        }).catch(err => {
            console.log(`Error al intentar entrar en pantalla completa: ${err.message}`);
        });
    } else {
        document.exitFullscreen().then(() => {
            fullscreenBtn.style.display = "block"; // Muestra el botón al salir de pantalla completa
        });
    }
}

// Detectar cambios en el modo pantalla completa y ocultar/mostrar el botón
document.addEventListener("fullscreenchange", () => {
    let fullscreenBtn = document.getElementById("fullscreen-btn");
    fullscreenBtn.style.display = document.fullscreenElement ? "none" : "block";
});

    </script>
</body>
</html>
